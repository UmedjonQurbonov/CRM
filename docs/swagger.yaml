basePath: /
definitions:
  http.AuthResponse:
    properties:
      tokens:
        $ref: '#/definitions/usecase.TokenPair'
      user:
        $ref: '#/definitions/http.UserDTO'
    type: object
  http.CreateExpenseRequest:
    properties:
      amount:
        example: "450.00"
        type: string
      category:
        example: utilities
        type: string
      comment:
        example: Monthly electricity bill for store
        type: string
      expense_date:
        example: "2026-09-22"
        type: string
    type: object
  http.CreateProductRequest:
    properties:
      cost_price:
        example: 15
        type: number
      min_stock_alert:
        example: 5
        type: integer
      name:
        example: Smartphone Case Pro
        type: string
      qr_code:
        example: QR-CASE-001
        type: string
      selling_price:
        example: 25
        type: number
      sku:
        example: CASE-001
        type: string
      stock_quantity:
        example: 50
        type: integer
    type: object
  http.CreateSellerRequest:
    properties:
      commission_rate:
        example: 5
        type: number
      name:
        example: Umedjon Qurbonov
        type: string
      password:
        example: SellerPass123!
        type: string
      phone:
        example: "+992901111111"
        type: string
    type: object
  http.ExpenseListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/usecase.ExpenseResponseDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 25
        type: integer
    type: object
  http.LoginRequest:
    properties:
      password:
        example: AdminPass123!
        type: string
      phone:
        example: "+992900000000"
        type: string
    type: object
  http.LogoutRequest:
    properties:
      refresh_token:
        example: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
        type: string
    type: object
  http.MessageResponse:
    properties:
      message:
        example: Success
        type: string
    type: object
  http.OrderListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/usecase.OrderResponseDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 50
        type: integer
    type: object
  http.ProductListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/usecase.ProductResponseDTO'
        type: array
      limit:
        example: 20
        type: integer
      offset:
        example: 0
        type: integer
      total:
        example: 100
        type: integer
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        example: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
        type: string
    type: object
  http.RefreshResponse:
    properties:
      tokens:
        $ref: '#/definitions/usecase.TokenPair'
    type: object
  http.UpdateCommissionRequest:
    properties:
      commission_rate:
        example: 7.5
        type: number
    type: object
  http.UpdateProductRequest:
    properties:
      cost_price:
        example: 16
        type: number
      min_stock_alert:
        example: 5
        type: integer
      name:
        example: Smartphone Case Pro (Black)
        type: string
      qr_code:
        example: QR-CASE-001
        type: string
      selling_price:
        example: 27
        type: number
      sku:
        example: CASE-001
        type: string
      stock_quantity:
        example: 60
        type: integer
    type: object
  http.UserDTO:
    properties:
      commission_rate:
        example: "0.00"
        type: string
      id:
        example: a43c2c77-4cf7-4f81-9b16-560ef71c9b68
        type: string
      name:
        example: Admin Owner
        type: string
      phone:
        example: "+992900000000"
        type: string
      role:
        example: owner
        type: string
    type: object
  main.HealthResponse:
    properties:
      database:
        example: connected
        type: string
      redis:
        example: connected
        type: string
      status:
        example: ok
        type: string
      timestamp:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      code:
        example: INVALID_CREDENTIALS
        type: string
      details:
        additionalProperties: {}
        type: object
      message:
        example: Invalid phone or password
        type: string
    type: object
  usecase.AnalyticsSummaryDTO:
    properties:
      cost_of_goods_sold:
        example: "7500.00"
        type: string
      gross_profit:
        example: "5000.00"
        type: string
      net_profit:
        example: "2950.00"
        type: string
      period_from:
        example: "2026-09-01"
        type: string
      period_to:
        example: "2026-09-22"
        type: string
      revenue:
        example: "12500.00"
        type: string
      total_commissions:
        example: "850.00"
        type: string
      total_expenses:
        example: "1200.00"
        type: string
      total_orders:
        example: 120
        type: integer
    type: object
  usecase.CartItemDTO:
    properties:
      product_id:
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      quantity:
        example: 2
        type: integer
    type: object
  usecase.CheckoutRequestDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/usecase.CartItemDTO'
        type: array
      payment_method:
        description: cash, card, transfer
        example: cash
        type: string
    type: object
  usecase.ExpenseResponseDTO:
    properties:
      amount:
        example: "450.00"
        type: string
      category:
        example: utilities
        type: string
      comment:
        example: Monthly electricity bill for store
        type: string
      created_at:
        example: "2026-09-22T10:00:00Z"
        type: string
      created_by:
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        type: string
      expense_date:
        example: "2026-09-22"
        type: string
      id:
        example: 497f6eca-6276-4993-bfeb-53cbbbba6f08
        type: string
    type: object
  usecase.OrderItemResponseDTO:
    properties:
      id:
        example: 7ca7b810-9dad-11d1-80b4-00c04fd430c9
        type: string
      product_id:
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      product_name:
        example: Sony WH-1000XM5
        type: string
      quantity:
        example: 2
        type: integer
      subtotal:
        example: "799.98"
        type: string
      unit_price:
        example: "399.99"
        type: string
    type: object
  usecase.OrderResponseDTO:
    properties:
      commission_earned:
        example: "40.00"
        type: string
      commission_rate_snapshot:
        example: "5.00"
        type: string
      created_at:
        type: string
      id:
        example: 5ba7b810-9dad-11d1-80b4-00c04fd430c7
        type: string
      items:
        items:
          $ref: '#/definitions/usecase.OrderItemResponseDTO'
        type: array
      payment_method:
        example: cash
        type: string
      seller_id:
        example: adfae494-4586-4992-b63a-8884bd0aac6c
        type: string
      status:
        example: completed
        type: string
      total_amount:
        example: "799.98"
        type: string
      updated_at:
        type: string
    type: object
  usecase.ProductResponseDTO:
    properties:
      cost_price:
        description: Masked to "0.00" for role 'seller'
        example: "15.00"
        type: string
      created_at:
        type: string
      id:
        example: 6ba7b810-9dad-11d1-80b4-00c04fd430c8
        type: string
      is_active:
        example: true
        type: boolean
      is_low_stock:
        example: false
        type: boolean
      min_stock_alert:
        example: 5
        type: integer
      name:
        example: Smartphone Case Pro
        type: string
      qr_code:
        example: QR-CASE-001
        type: string
      selling_price:
        example: "25.00"
        type: string
      sku:
        example: CASE-001
        type: string
      stock_quantity:
        example: 50
        type: integer
      updated_at:
        type: string
    type: object
  usecase.SellerEarningsDTO:
    properties:
      commission_rate:
        example: 8.50%
        type: string
      orders_count:
        example: 45
        type: integer
      period_from:
        example: "2026-09-01"
        type: string
      period_to:
        example: "2026-09-22"
        type: string
      seller_id:
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        type: string
      seller_name:
        example: Umedjon Qurbonov
        type: string
      total_commission_earned:
        example: "552.50"
        type: string
      total_sales_amount:
        example: "6500.00"
        type: string
    type: object
  usecase.SellerRankingDTO:
    properties:
      commission_earned:
        example: "552.50"
        type: string
      revenue_share_percentage:
        example: 52.00%
        type: string
      seller_id:
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
        type: string
      seller_name:
        example: Umedjon Qurbonov
        type: string
      total_orders:
        example: 45
        type: integer
      total_revenue:
        example: "6500.00"
        type: string
    type: object
  usecase.TokenPair:
    properties:
      access_token:
        type: string
      expires_in:
        description: in seconds
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  usecase.TopProductDTO:
    properties:
      product_id:
        example: 70cf0d01-fca2-45ff-bf86-99602ea12f39
        type: string
      product_name:
        example: Classic White T-Shirt
        type: string
      sku:
        example: TSHIRT-WHT-001
        type: string
      total_quantity_sold:
        example: 85
        type: integer
      total_revenue:
        example: "12750.00"
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: High-performance retail POS and inventory management API with RBAC,
    atomic checkout, and analytics.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Retail POS & Inventory API
  version: "1.0"
paths:
  /api/v1/analytics/sellers-ranking:
    get:
      description: Ranks sellers by completed sales volume, commission earned, and
        revenue share percentage for a period. Accessible exclusively to Owner.
      parameters:
      - description: Filter start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Filter end date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - default: 10
        description: Top N sellers
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/usecase.SellerRankingDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Sellers Ranking
      tags:
      - Analytics
  /api/v1/analytics/summary:
    get:
      description: Calculates Revenue, Cost of Goods Sold, Gross Profit, Expenses,
        Commissions, and Net Profit for a period. Accessible exclusively to Owner.
      parameters:
      - description: Filter start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Filter end date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.AnalyticsSummaryDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Financial P&L Statement
      tags:
      - Analytics
  /api/v1/analytics/top-products:
    get:
      description: Ranks catalog products by sales volume and total revenue generated
        for a period. Accessible exclusively to Owner.
      parameters:
      - description: Filter start date (YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Filter end date (YYYY-MM-DD)
        in: query
        name: to
        type: string
      - default: 10
        description: Top N products
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/usecase.TopProductDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Top Products by Revenue
      tags:
      - Analytics
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user by phone and password, issuing access and refresh
        tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: User Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates user refresh token session.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Validates refresh token, invalidates it (rotation), and issues
        a new token pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.RefreshResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: Refresh Access Token
      tags:
      - Auth
  /api/v1/expenses:
    get:
      description: Retrieve operational expenses with filtering by category, date
        range, and pagination. Accessible exclusively to Owner.
      parameters:
      - description: Filter by category substring
        in: query
        name: category
        type: string
      - description: Filter start date (YYYY-MM-DD)
        in: query
        name: from_date
        type: string
      - description: Filter end date (YYYY-MM-DD)
        in: query
        name: to_date
        type: string
      - default: 20
        description: Pagination limit (max 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.ExpenseListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Operational Expenses
      tags:
      - Expenses
    post:
      consumes:
      - application/json
      description: Record a store operational expense (rent, utilities, salaries,
        marketing, etc.). Accessible exclusively to Owner.
      parameters:
      - description: Expense creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.CreateExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usecase.ExpenseResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create Operational Expense
      tags:
      - Expenses
  /api/v1/expenses/{id}:
    delete:
      description: Permanently delete an erroneously recorded expense by UUID. Accessible
        exclusively to Owner.
      parameters:
      - description: Expense UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Operational Expense
      tags:
      - Expenses
  /api/v1/orders:
    get:
      description: Browse sales orders with optional filters. Sellers only see their
        own receipts.
      parameters:
      - description: Filter by seller UUID (Owner only)
        in: query
        name: seller_id
        type: string
      - description: 'Filter by status: completed or refunded'
        in: query
        name: status
        type: string
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: start_date
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: end_date
        type: string
      - default: 20
        description: Pagination limit (max 100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Pagination offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.OrderListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Sales Orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Creates sales receipt with atomic stock decrement and commission
        snapshot.
      parameters:
      - description: Checkout details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/usecase.CheckoutRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usecase.OrderResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Process Order Checkout
      tags:
      - Orders
  /api/v1/orders/{id}:
    get:
      description: Retrieve receipt details with items. Sellers can only view their
        own receipts.
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.OrderResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Order by ID
      tags:
      - Orders
  /api/v1/orders/{id}/refund:
    post:
      description: Issues a full refund, restocks inventory, and sets order status
        to refunded (Owner only).
      parameters:
      - description: Order UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.OrderResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
